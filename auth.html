<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account | Typosaurus</title>
    <script>try{if(localStorage.getItem("typingTheme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* Profile picture selector */
      .profile-picture-group { margin-top: 4px; }
      .profile-picture-label { display: block; margin-bottom: 10px; font-weight: 600; }
      .profile-picture-options { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
      .profile-option { width: 100%; aspect-ratio: 1; padding: 0; border: 2px solid transparent; border-radius: 14px; background: #f4f6f8; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease; }
      .profile-option:hover { transform: translateY(-2px); background: #eef2f7; }
      .profile-option.selected { border-color: #2563eb; background: #eff6ff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
      .profile-option img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .profile-preview { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: #6b7280; }
      .profile-preview-avatar { width: 46px; height: 46px; min-width: 46px; border-radius: 50%; background: #eef2ff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      .profile-preview-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
      @media (max-width: 500px) { .profile-picture-options { grid-template-columns: repeat(4, 1fr); } }
    </style>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <div class="auth-header">
          <h1>Sign in / Sign up here</h1>
          <p id="authSubtitle"></p>
        </div>

        <!-- Mode switch -->
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" id="loginTab">Login</button>
          <button type="button" class="auth-tab" id="signupTab">Create account</button>
        </div>

        <!-- Login form -->
        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="loginUsername">Username</label>
            <input type="text" id="loginUsername" name="username" autocomplete="username" placeholder="Enter your username" required />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="password-wrapper">
              <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Enter your password" required />
              <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password">Show</button>
            </div>
          </div>
          <button type="submit" class="auth-button" id="loginButton">Login</button>
          <p class="switch-text">Don't have an account? <button type="button" id="switchToSignup">Create one</button></p>
        </form>

        <!-- Signup form -->
        <form id="signupForm" class="auth-form hidden">
          <div class="form-group">
            <label for="signupUsername">Username</label>
            <input type="text" id="signupUsername" name="username" autocomplete="username" placeholder="Choose a username" minlength="3" maxlength="30" required />
          </div>

          <!-- Profile picture picker -->
          <div class="form-group profile-picture-group">
            <label class="profile-picture-label">Choose your profile picture</label>
            <div class="profile-picture-options" id="profilePictureOptions">
              <button type="button" class="profile-option selected" data-avatar="https://jkbjp.in/wp-content/uploads/2016/11/sh_narendra_modi_27.09.2016_1-1.png" aria-label="Choose profile picture 1"><img src="https://jkbjp.in/wp-content/uploads/2016/11/sh_narendra_modi_27.09.2016_1-1.png" alt="Profile picture 1" /></button>
              <button type="button" class="profile-option" data-avatar="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT26qlBV9LBE5Dmvy-cdZr8qAAeVkqrNDfbkTh6JoT9-Q&s" aria-label="Choose profile picture 2"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT26qlBV9LBE5Dmvy-cdZr8qAAeVkqrNDfbkTh6JoT9-Q&s" alt="Profile picture 2" /></button>
              <button type="button" class="profile-option" data-avatar="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRiio3eLYRdubH1WwqC1VgPk8hQYSShN_q4lLSeXK6cipReo09OdaB6i7hz&s=10" aria-label="Choose profile picture 3"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRiio3eLYRdubH1WwqC1VgPk8hQYSShN_q4lLSeXK6cipReo09OdaB6i7hz&s=10" alt="Profile picture 3" /></button>
              <button type="button" class="profile-option" data-avatar="https://cdn.pfps.gg/pfps/9134-funny-memes.png" aria-label="Choose profile picture 4"><img src="https://cdn.pfps.gg/pfps/9134-funny-memes.png" alt="Profile picture 4" /></button>
              <button type="button" class="profile-option" data-avatar="https://c.ndtvimg.com/2026-01/8r81dk38_varun-dhawan_625x300_15_January_26.jpeg?im=FeatureCrop,algorithm=dnn,width=270,height=300" aria-label="Choose profile picture 5"><img src="https://c.ndtvimg.com/2026-01/8r81dk38_varun-dhawan_625x300_15_January_26.jpeg?im=FeatureCrop,algorithm=dnn,width=270,height=300" alt="Profile picture 5" /></button>
              <button type="button" class="profile-option" data-avatar="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzoKFt7rHRjcem2HbpY4xuGm6K0MzACB-03fnxcID7j8KWCKs6MoNVgKw&s=10" aria-label="Choose profile picture 6"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzoKFt7rHRjcem2HbpY4xuGm6K0MzACB-03fnxcID7j8KWCKs6MoNVgKw&s=10" alt="Profile picture 6" /></button>
              <button type="button" class="profile-option" data-avatar="https://wallpapers.com/images/featured/meme-profile-pictures-vnigweuy4onsxunv.jpg" aria-label="Choose profile picture 7"><img src="https://wallpapers.com/images/featured/meme-profile-pictures-vnigweuy4onsxunv.jpg" alt="Profile picture 7" /></button>
              <button type="button" class="profile-option" data-avatar="https://i.pinimg.com/236x/5f/00/3e/5f003ee3e3bb7bd299f31241079d8c9a.jpg?nii=t" aria-label="Choose profile picture 8"><img src="https://i.pinimg.com/236x/5f/00/3e/5f003ee3e3bb7bd299f31241079d8c9a.jpg?nii=t" alt="Profile picture 8" /></button>
              <button type="button" class="profile-option" data-avatar="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTlUPDvlI9Ek8_sOs9KxqJW183sxhTclErb78rDGl-a_MwfSIkVSBoCNUW&s=10" aria-label="Choose profile picture 9"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTlUPDvlI9Ek8_sOs9KxqJW183sxhTclErb78rDGl-a_MwfSIkVSBoCNUW&s=10" alt="Profile picture 9" /></button>
              <button type="button" class="profile-option" data-avatar="https://m.sakshipost.com/sites/default/files/styles/storypage_main/public/gallery_images/2025/07/24/aneet%20padda6-1753357202.jpg?itok=PsDaWuIq" aria-label="Choose profile picture 10"><img src="https://m.sakshipost.com/sites/default/files/styles/storypage_main/public/gallery_images/2025/07/24/aneet%20padda6-1753357202.jpg?itok=PsDaWuIq" alt="Profile picture 10" /></button>
              <button type="button" class="profile-option" data-avatar="https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1592721086i/54199957.jpg" aria-label="Choose profile picture 11"><img src="https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1592721086i/54199957.jpg" alt="Profile picture 11" /></button>
              <button type="button" class="profile-option" data-avatar="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTlCn8upgdyBDKqIDjumOYOVl3q_1Zico0yDJZjZBtJA0f4F3lnqG-Yk1Q&s=10" aria-label="Choose profile picture 12"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTlCn8upgdyBDKqIDjumOYOVl3q_1Zico0yDJZjZBtJA0f4F3lnqG-Yk1Q&s=10" alt="Profile picture 12" /></button>
            </div>
            <div class="profile-preview">
              <div class="profile-preview-avatar" id="profilePreviewAvatar">
                <img src="https://jkbjp.in/wp-content/uploads/2016/11/sh_narendra_modi_27.09.2016_1-1.png" alt="Selected profile picture" id="profilePreviewImage" />
              </div>
              <span>This will be your profile picture.</span>
            </div>
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>
            <div class="password-wrapper">
              <input type="password" id="signupPassword" name="password" autocomplete="new-password" placeholder="Create a password" minlength="6" required />
              <button type="button" class="password-toggle" data-target="signupPassword" aria-label="Show password">Show</button>
            </div>
            <small>Password must be at least 6 characters.</small>
          </div>

          <div class="form-group">
            <label for="signupPasswordConfirm">Confirm password</label>
            <div class="password-wrapper">
              <input type="password" id="signupPasswordConfirm" name="confirmPassword" autocomplete="new-password" placeholder="Enter password again" required />
              <button type="button" class="password-toggle" data-target="signupPasswordConfirm" aria-label="Show password">Show</button>
            </div>
          </div>

          <button type="submit" class="auth-button" id="signupButton">Create account</button>
          <p class="switch-text">Already have an account? <button type="button" id="switchToLogin">Login</button></p>
        </form>

        <!-- Status -->
        <div id="authStatus" class="auth-status hidden"></div>
        <button type="button" class="continue-guest" id="continueGuest">Continue as guest</button>
      </section>
    </main>

    <script src="theme.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
